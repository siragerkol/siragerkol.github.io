bio: |
  I am a Research Assistant Professor at the [Center for Science of Science & Innovation](https://www.kellogg.northwestern.edu/academics-research/science-of-science/) at the Kellogg School of Management, Northwestern University, where I work with [Dashun Wang](https://www.dashunwang.com/).

  My research focuses on how careers unfold and change direction, both within individual careers and across generations, and what these patterns reveal about success in science and creative fields. I also work on innovation, analyzing how research finds its way into inventions and start-ups.

  My Ph.D. work focused on network science, specifically on optimization problems. I applied network approaches to questions ranging from identifying influential spreaders to optimal transport systems and the careers of scientists.

